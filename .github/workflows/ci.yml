name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio_local_only
          POSTGRES_DB: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://portfolio:portfolio_local_only@127.0.0.1:5432/portfolio
      DIRECT_URL: postgresql://portfolio:portfolio_local_only@127.0.0.1:5432/portfolio
      SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Generate disposable admin credentials
        run: |
          echo "ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "ADMIN_SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run db:push
      - name: Verify repeated seeds preserve edits and unrelated records
        run: node --import tsx scripts/check-seed.ts
        env:
          SEED_TEST_DATABASE: disposable
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke-test the production server without optional credentials
        run: |
          npm run start > /tmp/portfolio-cms-server.log 2>&1 &
          trap 'kill "$!"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-http.mjs
